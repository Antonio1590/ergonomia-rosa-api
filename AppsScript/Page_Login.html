<div id="page-login" class="page">
  <style>
    .entrada-wrapper {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2.5rem 1rem;
      background: linear-gradient(180deg, rgba(0, 128, 68, 0.04) 0%, rgba(255, 255, 255, 1) 100%);
      text-align: center;
    }
    .entrada-title { color: #008044; font-size: 2rem; font-weight: 900; line-height: 1.2; margin: .75rem 0 .35rem; }
    .entrada-sub { font-size: 1rem; color: #4A5568; font-weight: 500; }
    .entrada-card {
      width: min(100%, 420px); background: #fff; border-radius: 16px; text-align: left;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 128, 68, 0.12);
      padding: 2rem 1.75rem; margin-top: 1.75rem;
    }
    .entrada-card h2 { font-size: 1.1rem; margin-bottom: .35rem; color: #1A202C; }
    .entrada-card .hint { font-size: .82rem; color: #64748B; margin-top: .35rem; line-height: 1.4; }
    .admin-code { letter-spacing: .4em; font-size: 1.25rem; text-align: center; font-weight: 700; }
  </style>

  <div class="entrada-wrapper">
    <svg width="72" height="72" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="32" fill="#008044"/>
      <path d="M16 46 Q32 18 48 46" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="32" cy="22" r="5.5" fill="#FFDC5D"/>
      <path d="M22 40 Q32 30 42 40" stroke="#FFDC5D" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <h1 class="entrada-title">ROSA Expert</h1>
    <p class="entrada-sub">Análisis Ergonómico de Puesto de Trabajo (APT)</p>

    <!-- Mientras se abre la app: no pide nada -->
    <div id="entradaCargando" style="margin-top:1.75rem;" role="status" aria-live="polite">
      <div class="spinner-ring" style="width:34px;height:34px;border-width:3px;margin:0 auto .75rem;" aria-hidden="true"></div>
      <p class="text-sm text-muted" id="entradaMensaje">Abriendo la aplicación…</p>
      <button class="btn btn-sm btn-outline mt-4" id="entradaReintentar" hidden onclick="Entrada.iniciar()">Intentar de nuevo</button>
    </div>

    <!-- Después de salir -->
    <div class="entrada-card" id="entradaSalida" hidden style="text-align:center;">
      <h2>Saliste de ROSA Expert</h2>
      <p class="hint" id="entradaSalidaNota" style="margin:.5rem 0 1.25rem;"></p>
      <p class="hint" style="margin-bottom:1.25rem;">Ya puedes cerrar esta pestaña.</p>
      <button class="btn btn-primary btn-full" type="button" onclick="Entrada.iniciar()"
              style="background-color:#008044;border-color:#008044;">
        Volver a entrar
      </button>
    </div>

    <!-- Solo para administradores que Google no reconoce -->
    <div class="entrada-card" id="adminPanel" hidden>
      <h2>Acceso de administrador</h2>
      <p class="hint" style="margin-bottom:1rem;">Te enviamos un código a tu correo. Solo se pide la primera vez en este navegador: después entras directo.</p>

      <form id="adminForm" onsubmit="return false;">
        <div id="adminPasoCorreo">
          <div class="field">
            <label for="adminEmail" style="font-weight:600;color:#2D3748;">Correo de administrador</label>
            <input class="input" id="adminEmail" type="email" autocomplete="email" placeholder="nombre@correo.com">
          </div>
          <button class="btn btn-primary btn-full mt-4" type="button" id="btnPedirCodigo"
                  onclick="Guide.pedirCodigo()" style="background-color:#008044;border-color:#008044;">
            Enviar código
          </button>
        </div>

        <div id="adminPasoCodigo" hidden>
          <div class="field">
            <label for="adminCodigo" style="font-weight:600;color:#2D3748;">Código de 6 dígitos</label>
            <input class="input admin-code" id="adminCodigo" type="text" inputmode="numeric"
                   autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-describedby="adminCodigoHint">
            <p class="hint" id="adminCodigoHint"></p>
          </div>
          <button class="btn btn-primary btn-full mt-4" type="button" id="btnVerificarCodigo"
                  onclick="Guide.verificarCodigo()" style="background-color:#008044;border-color:#008044;">
            Abrir panel
          </button>
          <button class="link-btn mt-4" type="button" onclick="Guide.cambiarCorreoAdmin()">Usar otro correo</button>
        </div>

        <p class="field-error" id="adminError" role="alert" style="display:none;margin-top:.75rem;"></p>
      </form>

      <button class="btn btn-ghost btn-full mt-4" type="button" onclick="Entrada.volver()" style="color:#4A5568;">
        Volver a la evaluación
      </button>
    </div>
  </div>
</div>
