<div id="page-login" class="page">
  <div class="login-shell">
    <div class="login-card">

      <!-- Fondo: degradado + formas difuminadas, sin imágenes externas -->
      <div class="login-bg" aria-hidden="true">
        <span class="login-blob login-blob-1"></span>
        <span class="login-blob login-blob-2"></span>
        <span class="login-blob login-blob-3"></span>
        <svg class="login-art" viewBox="0 0 220 190" aria-hidden="true">
          <line x1="60" y1="176" x2="210" y2="176" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <rect x="118" y="120" width="86" height="6" rx="3" stroke="#fff" stroke-width="2" fill="none"/>
          <rect x="196" y="126" width="6" height="50" rx="2.5" stroke="#fff" stroke-width="2" fill="none"/>
          <rect x="146" y="66" width="52" height="38" rx="4" stroke="#fff" stroke-width="2" fill="none"/>
          <line x1="172" y1="104" x2="172" y2="120" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <line x1="158" y1="120" x2="186" y2="120" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M78 176 L78 140 Q78 128 90 128 L100 128" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <rect x="68" y="176" width="44" height="6" rx="3" stroke="#fff" stroke-width="2" fill="none"/>
          <circle cx="98" cy="96" r="12" stroke="#fff" stroke-width="2" fill="none"/>
          <path d="M86 128 Q98 108 110 128 L108 150 Q98 158 88 150 Z" stroke="#fff" stroke-width="2" fill="none"/>
          <path d="M108 130 L128 118" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="login-grid">

        <!-- Columna izquierda: marca + confianza -->
        <div class="login-brand">
          <div class="login-brand-top">
            <span class="login-mark">R</span>
            <span class="login-brand-name">ROSA Expert</span>
          </div>

          <div class="login-headline">
            <h1>Bienvenido<br>de nuevo</h1>
            <p>Evaluación ergonómica con IA, pensada para ayudarte.</p>
          </div>

          <div class="login-trust">
            <div class="trust-row">
              <span class="trust-icon" title="Análisis local" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" fill="none"/></svg>
              </span>
              <span class="trust-icon" title="Uso confidencial" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
              </span>
              <span class="trust-icon" title="Acceso controlado" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </div>
            <p class="trust-note">Fotos y resultados de uso confidencial, dentro de un entorno controlado.</p>
          </div>
        </div>

        <!-- Columna derecha: formulario -->
        <div class="login-form-col">
          <div class="login-form-wrap">

            <div class="login-divider"><span></span><h2>Iniciar sesión</h2><span></span></div>

            <form id="loginForm" onsubmit="return false;">
              <div class="login-field">
                <label for="loginCedula">Número de cédula</label>
                <input class="login-input" id="loginCedula" type="tel"
                       inputmode="numeric" pattern="[0-9]{6,12}"
                       placeholder="Ej: 1023456789" autocomplete="off" required>
              </div>

              <div class="login-field mt-5">
                <label for="loginEmail">Correo corporativo</label>
                <input class="login-input" id="loginEmail" type="email"
                       placeholder="nombre@segurosbolivar.com" autocomplete="email" required>
              </div>

              <p class="field-error login-error" id="loginError" style="display:none;"></p>

              <button class="login-submit" type="submit" id="btnLogin"
                      onclick="Guide.handleLogin()">
                Ingresar
              </button>
            </form>

            <p class="login-footnote">Acceso restringido a usuarios autorizados por Seguros Bolívar</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
