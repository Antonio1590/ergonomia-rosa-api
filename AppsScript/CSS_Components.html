<style>
/* ============================================================
   ROSA Expert — Componentes UI reutilizables
   ============================================================ */

/* Tarjetas ------------------------------------------------- */
.card {
  background: var(--c-surface);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--c-border);
}
.card-sm { padding: 1rem; border-radius: var(--radius-md); }
.card + .card { margin-top: 1rem; }

/* Botones -------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  padding: .75rem 1.5rem;
  border: none; border-radius: 99px;
  font-size: .9rem; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: all .18s ease;
  text-decoration: none; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:disabled { opacity: .45; pointer-events: none; }

.btn-primary { background: var(--c-brand); color: #fff; }
.btn-primary:hover { background: var(--c-brand-dk); box-shadow: 0 4px 12px rgba(0,82,36,.35); }

.btn-ok     { background: var(--c-ok); color: #fff; }
.btn-ok:hover { background: #15803d; }

.btn-outline {
  background: transparent;
  border: 2px solid currentColor;
  color: var(--c-brand);
}
.btn-outline:hover { background: var(--c-brand-lt); }

.btn-ghost { background: transparent; color: rgba(255,255,255,.85); }
.btn-ghost:hover { background: rgba(255,255,255,.12); }

/* Sobre la barra verde, btn-outline hereda el verde de marca y
   queda invisible. Dentro de la barra el contorno va en blanco. */
.navbar .btn-outline {
  color: #FFFFFF;
  border-color: rgba(255,255,255,.75);
  background: transparent;
}
.navbar .btn-outline:hover {
  background: rgba(255,255,255,.16);
  border-color: #FFFFFF;
}

.btn-sm { padding: .45rem 1rem; font-size: .8rem; }
.btn-lg { padding: .95rem 2rem; font-size: 1rem; }
.btn-full { width: 100%; }

/* Formularios --------------------------------------------- */
.field { display: flex; flex-direction: column; gap: .35rem; }
.field label { font-size: .82rem; font-weight: 600; color: var(--c-text-2); }

.input {
  padding: .8rem 1rem;
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-md);
  font-size: .95rem; font-family: inherit;
  background: var(--c-surface); color: var(--c-text);
  transition: border-color .15s;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--c-brand); }
.input::placeholder { color: var(--c-text-3); }

.field-error { font-size: .78rem; color: var(--c-error); margin-top: .2rem; }

/* Badge / Pill -------------------------------------------- */
.badge {
  display: inline-block;
  padding: .25rem .75rem;
  border-radius: 99px;
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
}
.badge-green  { background: #D1FAE5; color: #065F46; }
.badge-yellow { background: #FEF3C7; color: #92400E; }
.badge-red    { background: #FEE2E2; color: #991B1B; }
.badge-gray   { background: #F3F4F6; color: #6B7280; }
.badge-brand  { background: var(--c-brand); color: #fff; }

/* ===== Pantalla de resultados ============================= */
.results-head { margin-bottom: 1.5rem; }
.results-head p { margin-top: .35rem; }

/* Tarjeta principal de puntaje ---------------------------- */
.score-hero {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-sm);
  padding: 1.75rem 2rem;
  display: flex;
  align-items: center;
  gap: 2rem;
}
@media (max-width: 620px) {
  .score-hero { flex-direction: column; gap: 1rem; padding: 1.5rem 1.25rem; text-align: center; }
}

.score-gauge { position: relative; flex-shrink: 0; line-height: 0; }
.score-gauge svg { display: block; overflow: visible; }
.score-gauge #gaugeArc { transition: stroke-dashoffset .9s cubic-bezier(.22,1,.36,1), stroke .4s; }

.score-value {
  position: absolute;
  left: 0; right: 0; bottom: .35rem;
  display: flex; flex-direction: column; align-items: center;
  line-height: 1;
}
.score-num {
  font-size: 3rem; font-weight: 900;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.score-max { font-size: .72rem; color: var(--c-text-3); margin-top: .3rem; font-weight: 600; }

.score-meta { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
@media (max-width: 620px) { .score-meta { align-items: center; } }
.score-eyebrow {
  font-size: .7rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--c-text-3);
}
.score-summary { font-size: .9rem; line-height: 1.5; margin-top: .15rem; }

/* Rejilla de dos columnas --------------------------------- */
.results-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-top: 1.75rem;
  align-items: start;
}
@media (max-width: 860px) { .results-grid { grid-template-columns: 1fr; gap: 1.25rem; } }

.results-col { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
.results-col .section { margin-top: 0; }

/* Tarjeta de la foto -------------------------------------- */
.photo-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

/* Leyenda de colores -------------------------------------- */
.legend {
  display: flex; flex-wrap: wrap; gap: 1rem;
  padding: .8rem 1rem;
  border-top: 1px solid var(--c-border);
  background: var(--c-brand-lt);
}
.legend-item {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .75rem; font-weight: 600; color: var(--c-text-2);
}
.legend-dot {
  width: 9px; height: 9px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,.9);
}

/* Ajuste manual opcional ---------------------------------- */
.results-refine {
  text-align: center; font-size: .82rem;
  color: var(--c-text-3); margin-top: 1.75rem;
}
.link-btn {
  background: none; border: none; padding: 0;
  font: inherit; font-weight: 700; color: var(--c-brand);
  text-decoration: underline; cursor: pointer;
}
.link-btn:hover { color: var(--c-brand-dk); }

/* Acciones finales ---------------------------------------- */
.results-actions {
  display: flex; gap: .75rem; margin-top: 2rem;
  position: sticky; bottom: 1rem; z-index: 10;
}
.results-actions .btn { flex: 1; }
.results-actions .btn-ok {
  box-shadow: 0 6px 20px rgba(22,163,74,.3);
}
.results-actions .btn-outline {
  background: var(--c-surface);
  box-shadow: var(--shadow-sm);
}
@media (max-width: 480px) { .results-actions { flex-direction: column; } }

/* Recomendaciones ----------------------------------------- */
.rec-list { list-style: none; display: flex; flex-direction: column; gap: .6rem; }
.rec-item {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: .9rem 1.1rem;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-left: 4px solid var(--c-brand);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.rec-item.warn  { border-left-color: var(--c-warn); }
.rec-item.error { border-left-color: var(--c-error); }

/* La numeración es real: las recomendaciones van por prioridad */
.rec-num {
  flex-shrink: 0;
  width: 22px; height: 22px; margin-top: .05rem;
  border-radius: 50%;
  background: var(--c-brand-lt); color: var(--c-brand);
  font-size: .72rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.rec-item.warn  .rec-num { background: #FEF3C7; color: #92400E; }
.rec-item.error .rec-num { background: #FEE2E2; color: #991B1B; }
.rec-text { font-size: .875rem; color: var(--c-text-2); line-height: 1.45; }

/* Zona del cuerpo (body part card) ------------------------ */
.body-parts { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
@media (max-width: 400px) { .body-parts { grid-template-columns: 1fr; } }

.body-part-card {
  padding: .8rem .9rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--c-border);
  background: var(--c-surface);
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; gap: .65rem;
  min-width: 0;
}
.body-part-card.ok    { border-color: rgba(22,163,74,.35); }
.body-part-card.warn  { border-color: rgba(217,119,6,.35); }
.body-part-card.error { border-color: rgba(220,38,38,.35); }

/* El punto de la tarjeta usa el mismo código de color que la foto */
.body-part-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(0,0,0,.05);
}
.body-part-info { display: flex; flex-direction: column; min-width: 0; }
.body-part-name { font-size: .85rem; font-weight: 700; color: var(--c-text); }
.body-part-val  {
  font-size: .74rem; color: var(--c-text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Canvas overlay para análisis ---------------------------- */
.photo-canvas-wrap {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: #000;
  line-height: 0;
}
.photo-canvas-wrap canvas {
  width: 100%; display: block;
}

/* Objetos detectados -------------------------------------- */
.detected-grid {
  display: flex; flex-wrap: wrap; gap: .5rem;
}
.detected-chip {
  display: flex; align-items: center; gap: .35rem;
  padding: .35rem .85rem;
  background: var(--c-brand-lt);
  border-radius: 99px;
  font-size: .8rem; font-weight: 600;
  color: var(--c-brand-md);
  border: 1px solid rgba(0,82,36,.15);
}
.conf-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--c-ok);
}

/* Drop zone ----------------------------------------------- */
.dropzone {
  border: 2px dashed var(--c-border);
  border-radius: var(--radius-lg);
  padding: 2.5rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--c-surface);
}
.dropzone:hover, .dropzone.drag-over {
  border-color: var(--c-brand);
  background: var(--c-brand-lt);
}
.dropzone-icon { font-size: 2.5rem; margin-bottom: .5rem; }
.dropzone-title { font-weight: 700; font-size: 1rem; color: var(--c-text); }
.dropzone-sub   { font-size: .82rem; color: var(--c-text-3); margin-top: .25rem; }

/* Foto de guía -------------------------------------------- */
.guide-photo-wrap {
  position: relative; border-radius: var(--radius-lg); overflow: hidden;
  background: var(--c-brand-lt); line-height: 0;
  height: 320px;
}
.guide-photo-wrap img {
  width: 100%; height: 100%; object-fit: contain; display: block;
}
.guide-badge {
  position: absolute; top: .75rem; left: .75rem;
  background: var(--c-brand); color: #fff;
  padding: .25rem .75rem; border-radius: 99px;
  font-size: .72rem; font-weight: 700;
  line-height: 1.4;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
/* El contenedor usa line-height:0 para eliminar el hueco bajo la imagen;
   los hijos con texto deben recuperar una altura de línea normal. */
.guide-photo-wrap > *:not(img) { line-height: 1.5; }

/* ===== Calidad del encuadre ============================== */
.quality-panel { display: flex; flex-direction: column; gap: .6rem; margin-top: 1.25rem; }
.quality-card {
  display: flex; align-items: flex-start; gap: .75rem;
  padding: .85rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid;
}
.quality-card.ok    { background:#F0FDF4; border-color: rgba(5,150,105,.35); }
.quality-card.warn  { background:#FFFBEB; border-color: rgba(202,138,4,.4); }
.quality-card.error { background:#FFF1F2; border-color: rgba(159,18,57,.4); }
.quality-icon {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 900; color: #fff;
}
.quality-card.ok    .quality-icon { background:#059669; }
.quality-card.warn  .quality-icon { background:#CA8A04; }
.quality-card.error .quality-icon { background:#9F1239; }
.quality-title  { font-size: .86rem; font-weight: 700; color: var(--c-text); }
.quality-detail { font-size: .8rem; line-height: 1.5; margin-top: .15rem; }

/* Pregunta que la IA no pudo verificar */
.q-verificar {
  background: #FFFBEB;
  border-radius: var(--radius-md);
  padding: .8rem !important;
  margin-left: -.8rem; margin-right: -.8rem;
  box-shadow: inset 3px 0 0 #CA8A04;
}

/* ===== Gráficas ========================================== */
.chart-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem 1.35rem 1.4rem;
}
.chart-title { font-size: .95rem; font-weight: 700; color: var(--c-text); }
.chart-sub   { font-size: .78rem; color: var(--c-text-3); margin-top: .15rem; margin-bottom: 1rem; }
.chart-svg   { width: 100%; height: auto; display: block; overflow: visible; }
.chart-empty {
  font-size: .82rem; color: var(--c-text-3);
  text-align: center; padding: 2rem 1rem;
}

.dash-charts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.25rem;
}
@media (max-width: 780px) { .dash-charts { grid-template-columns: 1fr; } }

/* Barras horizontales ------------------------------------- */
.bar-chart { display: flex; flex-direction: column; gap: .7rem; }
.bar-row {
  display: grid;
  grid-template-columns: minmax(96px, 34%) 1fr auto;
  align-items: center; gap: .75rem;
  border-radius: var(--radius-sm);
}
.bar-row:focus-visible { outline: 2px solid var(--c-brand); outline-offset: 3px; }
.bar-label {
  display: flex; align-items: center; gap: .45rem;
  font-size: .8rem; font-weight: 600; color: var(--c-text-2);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bar-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.bar-track {
  height: 14px; background: #F1F4F2;
  border-radius: 99px; overflow: hidden; min-width: 0;
}
.bar-fill {
  display: block; height: 100%;
  border-radius: 99px;
  transition: width .6s cubic-bezier(.22,1,.36,1);
}
.bar-value {
  font-size: .85rem; font-weight: 800; color: var(--c-text);
  font-variant-numeric: tabular-nums; text-align: right;
  display: flex; align-items: baseline; gap: .35rem;
}
.bar-pct { font-size: .7rem; font-weight: 600; color: var(--c-text-3); }

/* Tooltip compartido -------------------------------------- */
.chart-tooltip {
  position: fixed; z-index: 500; pointer-events: none;
  background: #111827; color: #fff;
  font-size: .76rem; line-height: 1.45;
  padding: .5rem .7rem; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md); max-width: 240px;
}
.chart-tooltip .tip-row {
  display: flex; align-items: center; gap: .4rem;
  margin-top: .25rem; color: #E5E7EB;
}
.chart-tooltip .tip-row i {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

/* ===== Historial personal ================================ */
.hist-current { display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; }
.hist-score {
  font-size: 3rem; font-weight: 900; line-height: 1;
  letter-spacing: -.04em; font-variant-numeric: tabular-nums;
}
.hist-delta { flex: 1; }
.hist-trend {
  display: inline-block; font-size: .82rem; font-weight: 800;
  padding: .2rem .6rem; border-radius: 99px;
}
.hist-trend.mejora  { background: #D1FAE5; color: #065F46; }
.hist-trend.empeora { background: #FFE4E6; color: #9F1239; }
.hist-trend.igual   { background: #F3F4F6; color: #4B5563; }
.hist-delta-text { font-size: .85rem; line-height: 1.5; margin-top: .4rem; }

.hist-item {
  display: flex; align-items: center; gap: .75rem;
  padding: .8rem .95rem;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
}
.hist-item + .hist-item { margin-top: .5rem; }
.hist-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.hist-item-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.hist-item-date { font-size: .85rem; font-weight: 600; color: var(--c-text); }
.hist-item-sub  { font-size: .74rem; color: var(--c-text-3); font-variant-numeric: tabular-nums; }
.hist-item-score {
  font-size: 1.15rem; font-weight: 900; color: var(--c-text);
  font-variant-numeric: tabular-nums;
}
.hist-photo { font-size: .75rem; font-weight: 600; color: var(--c-brand); text-decoration: none; }
.hist-photo:hover { text-decoration: underline; }

/* ===== Cuestionario ROSA ================================= */
.q-layout {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: 1.75rem;
  align-items: start;
  margin-top: 1.5rem;
}
@media (max-width: 860px) { .q-layout { grid-template-columns: 1fr; gap: 1.25rem; } }

.q-aside { position: sticky; top: calc(var(--nav-h) + 1rem); }
@media (max-width: 860px) { .q-aside { position: static; } }
.q-aside-note {
  font-size: .8rem; line-height: 1.5;
  margin-top: .75rem; color: var(--c-text-2);
}

.q-form { display: flex; flex-direction: column; gap: 1.25rem; }

.q-group {
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  background: var(--c-surface);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem 1.35rem 1.35rem;
}
.q-legend {
  display: flex; align-items: center; gap: .6rem;
  font-size: .95rem; font-weight: 800; color: var(--c-brand);
  padding: 0 .4rem;
}
.q-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--c-brand); color: #fff;
  font-size: .72rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}

.q-item + .q-item { margin-top: 1.15rem; padding-top: 1.15rem; border-top: 1px solid var(--c-border); }

.q-label {
  font-size: .88rem; font-weight: 600; color: var(--c-text);
  margin-bottom: .6rem; line-height: 1.4;
}

/* Respuestas propuestas por el análisis de la foto */
.q-prefilled { position: relative; }
.q-badge-ai {
  display: inline-block; margin-left: .5rem;
  font-size: .63rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
  background: var(--c-brand-lt); color: var(--c-brand-md);
  padding: .18rem .5rem; border-radius: 99px;
  vertical-align: middle;
}

.q-options { display: flex; flex-direction: column; gap: .4rem; }

.q-opt, .q-check {
  display: flex; align-items: center; gap: .65rem;
  padding: .65rem .8rem;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  font-size: .85rem; color: var(--c-text-2);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  line-height: 1.35;
}
.q-opt:hover, .q-check:hover { border-color: var(--c-brand-md); background: var(--c-brand-lt); }

.q-opt input, .q-check input {
  accent-color: var(--c-brand);
  width: 17px; height: 17px;
  flex-shrink: 0; cursor: pointer; margin: 0;
}
.q-opt:has(input:checked), .q-check:has(input:checked) {
  border-color: var(--c-brand);
  background: var(--c-brand-lt);
  color: var(--c-text);
  font-weight: 600;
}

.q-checks { display: flex; flex-direction: column; gap: .4rem; margin-top: .6rem; }

/* Etiqueta de sección en cada recomendación */
.rec-tag {
  display: inline-block; margin-left: .5rem;
  font-size: .65rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em;
  color: var(--c-text-3);
  border: 1px solid var(--c-border);
  padding: .1rem .45rem; border-radius: 99px;
  vertical-align: middle;
}

/* Umbral de intervención del método */
.intervention-note {
  font-size: .78rem; line-height: 1.5;
  color: #92400E; background: #FEF3C7;
  border-radius: var(--radius-sm);
  padding: .55rem .75rem; margin-top: .5rem;
}

/* Aviso de instalación incompleta ------------------------- */
.fatal-card {
  max-width: 520px; margin: 3rem auto;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-top: 4px solid var(--c-error);
  border-radius: var(--radius-lg);
  padding: 2rem;
  box-shadow: var(--shadow-md);
  text-align: center;
}
.fatal-icon   { font-size: 2.25rem; }
.fatal-title  { font-size: 1.15rem; font-weight: 800; color: var(--c-text); margin-top: .75rem; }
.fatal-detail { font-size: .9rem; line-height: 1.6; margin-top: .75rem; }
.fatal-label  {
  font-size: .68rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--c-text-3); margin-top: 1.5rem;
}
.fatal-code {
  display: block; margin-top: .4rem;
  font-family: var(--font-mono); font-size: .78rem;
  background: var(--c-brand-lt); color: var(--c-brand);
  padding: .6rem .8rem; border-radius: var(--radius-sm);
  word-break: break-word;
}

/* Fila de botones para elegir foto ------------------------ */
.picker-row { display: flex; gap: .75rem; margin-top: .75rem; }
