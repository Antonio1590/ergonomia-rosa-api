<script>
// ============================================================
// JS_Dashboard — Panel de administración
// ============================================================

var Dashboard = (function() {
  var _all     = [];
  var _filtered = [];
  var _page    = 0;
  var PAGE_SIZE = 20;

  // ── Cargar datos ─────────────────────────────────────────
  async function load() {
    document.getElementById('dashTableBody').innerHTML =
      '<tr><td colspan="5" style="text-align:center;padding:2.5rem 1rem;">' +
        '<div class="spinner-ring" style="width:30px;height:30px;border-width:3px;margin:0 auto .75rem;" aria-hidden="true"></div>' +
        '<span style="display:block;color:var(--c-text-3);font-size:.85rem;">Cargando evaluaciones…</span>' +
      '</td></tr>';

    try {
      var result = await Api.getEvaluations();
      if (!result.ok) throw new Error(result.error);
      _all      = (result.data || []).reverse();  // más reciente primero
      _filtered = _all;
      _page     = 0;
      renderStats();
      renderUrgentCases();
      renderCharts();
      renderTable();
    } catch (err) {
      App.toast('Error cargando evaluaciones: ' + err.message, 'error');
      document.getElementById('dashTableBody').innerHTML =
        '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--c-text-3);">No se pudo cargar.</td></tr>';
    }
  }

  // ── Estadísticas ─────────────────────────────────────────
  function renderStats() {
    var total  = _all.length;
    var high   = _all.filter(function(r){ return r.nivelRiesgo === 'Alto' || r.nivelRiesgo === 'Muy Alto'; }).length;
    var scores = _all.map(function(r){ return Number(r.puntajeFinal) || 0; }).filter(Boolean);
    var avg    = scores.length ? (scores.reduce(function(a,b){ return a+b; }, 0) / scores.length).toFixed(1) : '—';
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statHigh').textContent  = high;
    document.getElementById('statAvg').textContent   = avg;
  }

  // ── Gráficas ─────────────────────────────────────────────
  function renderCharts() {
    // Distribución por nivel de riesgo
    var conteo = {};
    Charts.ORDEN_RIESGO.forEach(function(n) { conteo[n] = 0; });
    _all.forEach(function(r) {
      if (conteo[r.nivelRiesgo] !== undefined) conteo[r.nivelRiesgo]++;
    });

    Charts.barras('chartRiesgo', Charts.ORDEN_RIESGO.map(function(n) {
      return { etiqueta: n, valor: conteo[n], color: Charts.RIESGO[n] };
    }));

    // Promedio por sección: revela qué bloque del puesto falla más
    var secciones = [
      { clave:'silla',    etiqueta:'Silla' },
      { clave:'pantalla', etiqueta:'Monitor y teléfono' },
      { clave:'teclado',  etiqueta:'Mouse y teclado' }
    ];

    var promedios = secciones.map(function(s) {
      var vals = _all.map(function(r) { return leerDetalle(r, s.clave); })
                     .filter(function(v) { return v > 0; });
      var prom = vals.length
        ? Math.round(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length * 10) / 10
        : 0;
      return { etiqueta: s.etiqueta, valor: prom, color: colorPorPuntaje(prom) };
    });

    // Son promedios sobre la escala ROSA, no partes de un total
    Charts.barras('chartSecciones', promedios, {
      comoParte: false, escalaMax: 10, sufijo: 'de 10'
    });

    // Tendencia mensual
    Charts.linea('chartTendencia', promedioMensual(), {
      maxY: 10, umbral: 5, aria: 'Puntaje promedio por mes'
    });
  }

  // ── Casos que necesitan atención pronto ──────────────────
  // Sin esto, un admin solo se entera de un caso de riesgo Alto/Muy Alto
  // si revisa la tabla completa. Muestra los 5 más recientes.
  function renderUrgentCases() {
    var cont = document.getElementById('urgentCases');
    if (!cont) return;

    var esUrgente = function(r) { return r.nivelRiesgo === 'Alto' || r.nivelRiesgo === 'Muy Alto'; };
    var todos = _all.filter(esUrgente);
    var casos = todos.slice(0, 5);   // _all ya viene del más reciente al más viejo

    if (!casos.length) { cont.hidden = true; cont.innerHTML = ''; return; }

    cont.innerHTML =
      '<div class="urgent-head">' +
        '<span class="urgent-icon" aria-hidden="true">⚠</span>' +
        '<h3 class="urgent-title">Casos que necesitan atención pronto</h3>' +
        '<span class="urgent-count">' + todos.length + '</span>' +
      '</div>' +
      '<div class="urgent-list">' +
        casos.map(function(r) {
          var cfg    = riskCfg(r.nivelRiesgo);
          var nombre = r.nombre || (r.email || '').split('@')[0];
          var fecha  = r.fecha ? new Date(r.fecha).toLocaleDateString('es-CO') : '—';
          return '<button class="urgent-row" type="button">' +
            '<span class="urgent-score" style="color:' + cfg.hex + '">' + r.puntajeFinal + '</span>' +
            '<span class="urgent-name">' + nombre + '</span>' +
            '<span class="urgent-date">' + fecha + '</span>' +
            '<span class="badge ' + cfg.badge + '">' + r.nivelRiesgo + '</span>' +
          '</button>';
        }).join('') +
      '</div>';
    cont.hidden = false;

    cont.querySelectorAll('.urgent-row').forEach(function(el, idx) {
      el.addEventListener('click', function() { abrirDetalle(casos[idx]); });
    });
  }

  // ── Detalle de una evaluación ─────────────────────────────
  function abrirDetalle(registro) {
    if (!registro) return;
    var cfg = riskCfg(registro.nivelRiesgo);

    document.getElementById('modalNombre').textContent = registro.nombre || registro.email;
    document.getElementById('modalSub').textContent =
      (registro.cedula ? 'Cédula ' + registro.cedula + ' · ' : '') +
      (registro.fecha
        ? new Date(registro.fecha).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })
        : '');

    var det = {};
    try {
      det = typeof registro.detalles === 'string' ? JSON.parse(registro.detalles) : (registro.detalles || {});
    } catch (e) {}
    var objetos = Array.isArray(det.objetos) ? det.objetos : (det.objetos ? [det.objetos] : []);
    var recs = (registro.recomendaciones || '').split('|').map(function(r) { return r.trim(); }).filter(Boolean);

    var html = '<div class="modal-score-row">' +
      '<span class="modal-score" style="color:' + cfg.hex + '">' + registro.puntajeFinal + '</span>' +
      '<span class="badge ' + cfg.badge + '">Riesgo ' + registro.nivelRiesgo + '</span>' +
    '</div>';

    if (det.silla != null || det.pantalla != null || det.teclado != null) {
      var TILES = [['silla', 'Silla'], ['pantalla', 'Pantalla'], ['teclado', 'Teclado/mouse']];
      html += '<div class="modal-grid">' + TILES.map(function(t) {
        var v = det[t[0]];
        return '<div class="modal-tile"><p class="modal-tile-val">' + (v != null ? v : '—') + '</p>' +
               '<p class="modal-tile-label">' + t[1] + '</p></div>';
      }).join('') + '</div>';
    }

    if (objetos.length) {
      html += '<p class="modal-section-title">Objetos detectados</p><div class="modal-chips">' +
        objetos.map(function(o) { return '<span class="modal-chip">' + o + '</span>'; }).join('') +
      '</div>';
    }

    if (recs.length) {
      html += '<p class="modal-section-title">Recomendaciones</p><ul class="modal-recs">' +
        recs.map(function(r, i) {
          return '<li><span class="modal-rec-num">' + (i + 1) + '</span>' + r + '</li>';
        }).join('') +
      '</ul>';
    }

    if (registro.urlImagen) {
      html += '<a class="modal-photo-link" href="' + registro.urlImagen + '" target="_blank" rel="noopener">Ver foto en Drive</a>';
    }

    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('evalModal').hidden = false;
  }

  function cerrarDetalle() {
    document.getElementById('evalModal').hidden = true;
  }

  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    var modal = document.getElementById('evalModal');
    if (modal && !modal.hidden) cerrarDetalle();
  });

  // El detalle viaja como JSON en la hoja
  function leerDetalle(registro, clave) {
    if (!registro.detalles) return 0;
    try {
      var d = typeof registro.detalles === 'string'
        ? JSON.parse(registro.detalles) : registro.detalles;
      return Number(d[clave]) || 0;
    } catch (e) { return 0; }
  }

  // Color y clase de badge por nivel de riesgo, en un solo lugar:
  // lo usan la tabla, la alerta de riesgo alto y el modal de detalle.
  function riskCfg(nivel) {
    if (nivel === 'Bajo')  return { hex: Charts.RIESGO['Bajo'],  badge: 'badge-green' };
    if (nivel === 'Medio') return { hex: Charts.RIESGO['Medio'], badge: 'badge-yellow' };
    if (nivel === 'Alto' || nivel === 'Muy Alto') return { hex: Charts.RIESGO[nivel], badge: 'badge-red' };
    return { hex: '#6B7280', badge: 'badge-gray' };
  }

  function colorPorPuntaje(p) {
    if (p <= 2) return Charts.RIESGO['Bajo'];
    if (p <= 4) return Charts.RIESGO['Medio'];
    if (p <= 7) return Charts.RIESGO['Alto'];
    return Charts.RIESGO['Muy Alto'];
  }

  function promedioMensual() {
    var meses = {};
    _all.forEach(function(r) {
      if (!r.fecha) return;
      var d = new Date(r.fecha);
      if (isNaN(d)) return;
      var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      if (!meses[k]) meses[k] = { suma: 0, n: 0, fecha: d };
      meses[k].suma += Number(r.puntajeFinal) || 0;
      meses[k].n++;
    });

    return Object.keys(meses).sort().map(function(k) {
      var m    = meses[k];
      var prom = Math.round(m.suma / m.n * 10) / 10;
      return {
        valor: prom,
        nivel: nivelDePuntaje(prom),
        etiqueta: m.fecha.toLocaleDateString('es-CO', { month:'short', year:'2-digit' }),
        etiquetaLarga: m.fecha.toLocaleDateString('es-CO', { month:'long', year:'numeric' }) +
                       ' · ' + m.n + ' evaluacion' + (m.n === 1 ? '' : 'es')
      };
    });
  }

  function nivelDePuntaje(p) {
    if (p <= 2) return 'Bajo';
    if (p <= 4) return 'Medio';
    if (p <= 7) return 'Alto';
    return 'Muy Alto';
  }

  // Convierte un Date a "YYYY-MM-DD" en hora local (no UTC), para que
  // coincida con lo que el navegador guarda en un <input type="date">.
  function fechaISOLocal(d) {
    var mes = String(d.getMonth() + 1).padStart(2, '0');
    var dia = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mes + '-' + dia;
  }

  // ── Filtrado ─────────────────────────────────────────────
  function filter() {
    var q     = (document.getElementById('dashSearch').value || '').toLowerCase();
    var risk  = document.getElementById('dashRisk').value;
    var desde = document.getElementById('dashDesde').value;
    var hasta = document.getElementById('dashHasta').value;

    _filtered = _all.filter(function(r) {
      var matchQ = !q || (r.email || '').toLowerCase().includes(q)
                       || (r.nombre || '').toLowerCase().includes(q);
      var matchR = !risk || r.nivelRiesgo === risk;

      var matchFecha = true;
      if (desde || hasta) {
        if (!r.fecha) return false;
        var f = new Date(r.fecha);
        if (isNaN(f)) return false;
        var fISO = fechaISOLocal(f);
        if (desde && fISO < desde) matchFecha = false;
        if (hasta && fISO > hasta) matchFecha = false;
      }

      return matchQ && matchR && matchFecha;
    });
    _page = 0;
    renderTable();
  }

  function limpiarFiltros() {
    document.getElementById('dashSearch').value = '';
    document.getElementById('dashRisk').value = '';
    document.getElementById('dashDesde').value = '';
    document.getElementById('dashHasta').value = '';
    filter();
  }

  // ── Renderizar tabla ─────────────────────────────────────
  function renderTable() {
    var tbody = document.getElementById('dashTableBody');
    var pages = document.getElementById('dashPages');
    var info  = document.getElementById('dashResultsInfo');
    var start = _page * PAGE_SIZE;
    var slice = _filtered.slice(start, start + PAGE_SIZE);

    if (info) {
      info.textContent = _filtered.length
        ? 'Mostrando ' + (start + 1) + '–' + (start + slice.length) + ' de ' + _filtered.length + ' evaluaciones'
        : 'Sin resultados para este filtro';
    }

    if (slice.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--c-text-3);">Sin resultados</td></tr>';
      pages.innerHTML = '';
      return;
    }

    tbody.innerHTML = slice.map(function(r) {
      var fecha   = r.fecha ? new Date(r.fecha).toLocaleDateString('es-CO') : '—';
      var nombre  = r.nombre || (r.email || '').split('@')[0];
      var score   = Number(r.puntajeFinal).toFixed(1);
      var cfg     = riskCfg(r.nivelRiesgo);
      var fotoLink = r.urlImagen
        ? '<a href="' + r.urlImagen + '" target="_blank" style="color:var(--c-brand);" onclick="event.stopPropagation();">Ver</a>'
        : '—';
      return '<tr>' +
        '<td>' + fecha + '</td>' +
        '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + nombre + '</td>' +
        '<td style="font-weight:700;">' + score + '</td>' +
        '<td><span class="badge ' + cfg.badge + '">' + (r.nivelRiesgo || '—') + '</span></td>' +
        '<td>' + fotoLink + '</td>' +
        '</tr>';
    }).join('');

    // Clic en cualquier fila abre el detalle completo de esa evaluación
    tbody.querySelectorAll('tr').forEach(function(tr, idx) {
      tr.addEventListener('click', function() { abrirDetalle(slice[idx]); });
    });

    // Paginación: Anterior · hasta 5 números centrados en la página actual · Siguiente
    var totalPages = Math.ceil(_filtered.length / PAGE_SIZE);
    pages.innerHTML = '';
    if (totalPages <= 1) return;

    function botonPagina(etiqueta, pagina, activo, deshabilitado) {
      var btn = document.createElement('button');
      btn.className = 'btn btn-sm ' + (activo ? 'btn-primary' : 'btn-outline');
      btn.textContent = etiqueta;
      btn.disabled = !!deshabilitado;
      btn.onclick = function() {
        _page = pagina;
        renderTable();
        var wrap = document.getElementById('dashTableWrap');
        if (wrap) window.scrollTo({ top: wrap.offsetTop - 80, behavior: 'smooth' });
      };
      return btn;
    }

    pages.appendChild(botonPagina('‹ Anterior', Math.max(0, _page - 1), false, _page === 0));

    var desdeN = Math.max(0, Math.min(_page - 2, totalPages - 5));
    var hastaN = Math.min(totalPages, desdeN + 5);
    for (var i = desdeN; i < hastaN; i++) {
      pages.appendChild(botonPagina(String(i + 1), i, i === _page, false));
    }

    pages.appendChild(botonPagina('Siguiente ›', Math.min(totalPages - 1, _page + 1), false, _page === totalPages - 1));
  }

  // ── Exportar CSV ─────────────────────────────────────────
  function exportCSV() {
    var headers = ['Fecha','Email','Puntaje','Riesgo','URLFoto','Neck','Trunk','Legs','Arms'];
    var rows = [headers.join(',')];
    _filtered.forEach(function(r) {
      rows.push([
        '"' + (r.fecha || '') + '"',
        '"' + (r.email || '') + '"',
        r.puntajeFinal || '',
        '"' + (r.nivelRiesgo || '') + '"',
        '"' + (r.urlImagen || '') + '"',
        r.neck || '', r.trunk || '', r.legs || '', r.arms || ''
      ].join(','));
    });

    var blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'rosa-expert-' + Date.now() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  return { load, filter, limpiarFiltros, exportCSV, abrirDetalle, cerrarDetalle };
})();
</script>
